title: Rapid local administrator password change and restoration
id: 9f3b2c6d-5a1b-4d2e-8f6b-3c2a1e9d7b8f
status: experimental
description: Detects password change/reset events for local administrator accounts. BlueHammer PoC forces an admin password change, authenticates, then restores original hash — rapid change and restore is suspicious.
author: Detection Engineer
date: 2026/04/21
references:
  - https://www.cyderes.com/howler-cell/windows-zero-day-bluehammer
tags:
  - attack.credential-access
  - attack.privilege-escalation

logsource:
  product: windows

detection:
  selection_password_change:
    EventID: [4723, 4724]
    TargetUserName: Administrator

  condition: selection_password_change

level: high
falsepositives:
  - Legitimate password rotation events for built-in accounts

falsepositives_note: "Investigate change and follow-up authentication events; look for rapid restore patterns or service creation following the event."
