title: Possible BlueHammer Exploit - Rapid Admin Password Reset and Restoration
id: 9b5c4d3e-2f6a-5b7c-0d9e-8f1a2b3c4d5e
status: experimental
description: |
    Detects two or more password reset events (Event ID 4724) targeting the same account
    within a short timespan. The BlueHammer exploit forcibly resets a local administrator
    password using SamiChangePasswordUser, authenticates with it for privilege escalation,
    then restores the original NTLM hash to cover its tracks. This produces two 4724 events
    on the same account in rapid succession, a pattern with very few legitimate explanations.
references:
    - https://www.cyderes.com/howler-cell/windows-zero-day-bluehammer
author: Workshop
date: 2026-04-17
tags:
    - attack.credential_access
    - attack.t1003.002
    - attack.privilege_escalation
    - attack.t1134
correlation:
    type: event_count
    rules:
        - bluehammer_admin_password_reset
    group-by:
        - TargetUserName
    timespan: 5m
    condition:
        gte: 2
level: high
