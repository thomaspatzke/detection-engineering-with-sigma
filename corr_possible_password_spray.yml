title: Failed Logon (AD)
id: 0589514f-5dfc-4748-badd-324226c40db2
name: failed_logon
status: experimental
description: Failed logon attempts in Active Directory
author: Thomas Patzke
date: 2025-10-04
logsource:
    product: windows
    service: security
detection:
    selection:
       EventID: 4625
    condition: selection
falsepositives:
    - Users who fail to logon by typos, forgotten passwords etc.
    - Misconfigured services
    - Vulnerability scanners
level: informational
---
title: Possible password spray attack
description: Multiple failed logons for different users from single source.
status: test
id: 2eaa55c3-8ed4-454c-b3a8-8f532a72111a
tags:
    - attack.t1110.001
correlation:
    type: value_count
    rules:
        - failed_logon
    group-by:
        - IpAddress
    timespan: 5m
    condition:
        gte: 10
        field: TargetUserName